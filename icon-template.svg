<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" stroke="#fff" stroke-width="3"/>
  
  <!-- 购物袋图标 -->
  <g transform="translate(32, 28)">
    <!-- 袋子主体 -->
    <rect x="8" y="24" width="48" height="52" rx="4" ry="4" fill="white" opacity="0.9"/>
    <!-- 袋子底部阴影 -->
    <rect x="8" y="68" width="48" height="8" rx="4" ry="4" fill="white" opacity="0.6"/>
    <!-- 手提把手 -->
    <path d="M20 24 Q20 16 32 16 Q44 16 44 24" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- ProductId标识 -->
    <text x="32" y="50" text-anchor="middle" fill="#667eea" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ID</text>
    <text x="32" y="64" text-anchor="middle" fill="#667eea" font-family="monospace" font-size="8">123456</text>
  </g>
</svg>
