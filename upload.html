<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传图片/视频</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e8e8;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-list {
            margin-top: 20px;
        }
        
        .file-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .file-info {
            flex: 1;
            overflow: hidden;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-size {
            color: #999;
            font-size: 12px;
        }
        
        .file-remove {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .file-remove:hover {
            background: #dc2626;
        }
        
        .upload-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress {
            margin-top: 20px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .message.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .max-files {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 上传图片/视频</h1>
        <p class="subtitle">最多可同时上传5个文件</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持图片和视频文件</div>
        </div>
        
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
        
        <div class="file-list" id="fileList"></div>
        
        <div class="max-files" id="maxFilesMsg" style="display: none;">最多只能上传5个文件</div>
        
        <button class="upload-btn" id="uploadBtn" disabled>上传文件</button>
        
        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
    </div>
    
    <script>
        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        if (!sessionId) {
            alert('缺少会话ID，请重新扫描二维码');
            window.close();
        }
        
        // Supabase configuration (user needs to configure)
        // TODO: Replace with your Supabase URL and anon key
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const STORAGE_BUCKET = 'sync-images'; // Bucket name in Supabase Storage
        
        let selectedFiles = [];
        const MAX_FILES = 5;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const message = document.getElementById('message');
        const maxFilesMsg = document.getElementById('maxFilesMsg');
        
        // Initialize Supabase client
        let supabase = null;
        if (SUPABASE_URL && SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
            // Load Supabase client library
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
            script.onload = () => {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            };
            document.head.appendChild(script);
        }
        
        // Click to select files
        uploadArea.addEventListener('click', () => {
            if (selectedFiles.length < MAX_FILES) {
                fileInput.click();
            }
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (selectedFiles.length >= MAX_FILES) {
                showMessage('最多只能上传5个文件', 'error');
                return;
            }
            
            const files = Array.from(e.dataTransfer.files);
            addFiles(files);
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
        });
        
        // Add files to list
        function addFiles(files) {
            const remainingSlots = MAX_FILES - selectedFiles.length;
            const filesToAdd = files.slice(0, remainingSlots);
            
            if (files.length > remainingSlots) {
                showMessage(`最多只能上传${MAX_FILES}个文件，已选择${filesToAdd.length}个`, 'error');
            }
            
            filesToAdd.forEach(file => {
                if (selectedFiles.length >= MAX_FILES) return;
                
                // Validate file type
                if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                    showMessage(`不支持的文件类型: ${file.name}`, 'error');
                    return;
                }
                
                // Validate file size (max 50MB)
                if (file.size > 50 * 1024 * 1024) {
                    showMessage(`文件太大: ${file.name} (最大50MB)`, 'error');
                    return;
                }
                
                selectedFiles.push(file);
                renderFileList();
            });
        }
        
        // Remove file
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }
        
        // Render file list
        function renderFileList() {
            fileList.innerHTML = '';
            
            if (selectedFiles.length === 0) {
                uploadBtn.disabled = true;
                return;
            }
            
            uploadBtn.disabled = false;
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileInfo = document.createElement('div');
                fileInfo.className = 'file-info';
                
                const fileName = document.createElement('div');
                fileName.className = 'file-name';
                fileName.textContent = file.name;
                
                const fileSize = document.createElement('div');
                fileSize.className = 'file-size';
                fileSize.textContent = formatFileSize(file.size);
                
                fileInfo.appendChild(fileName);
                fileInfo.appendChild(fileSize);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'file-remove';
                removeBtn.textContent = '移除';
                removeBtn.onclick = () => removeFile(index);
                
                fileItem.appendChild(fileInfo);
                fileItem.appendChild(removeBtn);
                fileList.appendChild(fileItem);
            });
            
            if (selectedFiles.length >= MAX_FILES) {
                maxFilesMsg.style.display = 'block';
            } else {
                maxFilesMsg.style.display = 'none';
            }
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // Show message
        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
        
        // Upload files
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            
            if (!supabase) {
                showMessage('请先配置Supabase', 'error');
                return;
            }
            
            uploadBtn.disabled = true;
            progress.style.display = 'block';
            progressFill.style.width = '0%';
            
            try {
                const uploadPromises = selectedFiles.map(async (file, index) => {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${sessionId}_${Date.now()}_${index}.${fileExt}`;
                    const filePath = `${sessionId}/${fileName}`;
                    
                    // Upload to Supabase Storage
                    const { data, error } = await supabase.storage
                        .from(STORAGE_BUCKET)
                        .upload(filePath, file, {
                            cacheControl: '3600',
                            upsert: false
                        });
                    
                    if (error) throw error;
                    
                    // Get public URL
                    const { data: urlData } = supabase.storage
                        .from(STORAGE_BUCKET)
                        .getPublicUrl(filePath);
                    
                    // Save metadata to database (optional)
                    // You can create a table in Supabase to store file metadata
                    // const { error: dbError } = await supabase
                    //     .from('uploaded_images')
                    //     .insert({
                    //         session_id: sessionId,
                    //         file_name: file.name,
                    //         file_path: filePath,
                    //         file_url: urlData.publicUrl,
                    //         file_type: file.type,
                    //         file_size: file.size,
                    //         created_at: new Date().toISOString(),
                    //         expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString() // 1 day
                    //     });
                    
                    return {
                        name: file.name,
                        url: urlData.publicUrl,
                        type: file.type,
                        size: file.size
                    };
                });
                
                // Update progress
                let completed = 0;
                uploadPromises.forEach((promise, index) => {
                    promise.then(() => {
                        completed++;
                        progressFill.style.width = `${(completed / selectedFiles.length) * 100}%`;
                    });
                });
                
                await Promise.all(uploadPromises);
                
                showMessage('上传成功！', 'success');
                
                // Clear files after 2 seconds
                setTimeout(() => {
                    selectedFiles = [];
                    renderFileList();
                    progress.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 2000);
                
            } catch (error) {
                console.error('Upload error:', error);
                showMessage(`上传失败: ${error.message}`, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
